<div class="mymain">
    <header class="mobile-header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon"></div>
                <span class="logo-text">FreelanceHub</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="page-header">
            <h1>Profile</h1>
            <p>Manage your account information</p>
        </section>

        @if (loading()) {
            <div style="text-align: center; padding: 40px; color: #64748b;">
                <p>Loading profile...</p>
            </div>
        }

        @if (!loading()) {
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <img src="/me.jpg" alt="Profile">
                    </div>
                    <div class="profile-info">
                        <h2>{{ user()?.firstName }} {{ user()?.lastName }}</h2>
                        <p>{{ user()?.email }}</p>
                        <span class="user-badge">Client</span>
                    </div>
                </div>

                <form class="profile-form" (submit)="saveProfile(); $event.preventDefault()">
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" [(ngModel)]="profileForm.companyName" name="companyName" placeholder="Enter your company name">
                    </div>

                    <div class="form-group">
                        <label>Bio</label>
                        <textarea [(ngModel)]="profileForm.bio" name="bio" rows="4" placeholder="Tell us about your company"></textarea>
                    </div>

                    <div class="profile-stats">
                        <div class="stat-item">
                            <span class="stat-label">Total Gigs Posted</span>
                            <span class="stat-value">{{ profile()?.totalGigsPosted || 0 }}</span>
                        </div>
                    </div>

                    <button type="submit" class="save-btn">Save Changes</button>
                </form>

                <button class="logout-btn" (click)="logout()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </button>
            </div>
        }
    </main>

    <nav class="bottom-nav">
        <a routerLink="/client/home" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span>Home</span>
        </a>
        <a routerLink="/client/orders" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 12l2 2 4-4"/>
                <circle cx="12" cy="12" r="9"/>
            </svg>
            <span>Orders</span>
        </a>
        <a routerLink="/client/profile" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Profile</span>
        </a>
    </nav>
</div>
