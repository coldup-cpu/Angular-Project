<div class="mymain">
    <div class="auth-container">
        <div class="background-gradient"></div>
        <div class="floating-elements">
            <div class="floating-orb orb-1"></div>
            <div class="floating-orb orb-2"></div>
            <div class="floating-orb orb-3"></div>
        </div>

        <header class="header" style="margin-bottom: 85px;">
            <div class="logo">
                <h1>FreelanceHub</h1>
            </div>
        </header>

        <main class="main-content">
            @if (errorMessage()) {
                <div class="error-message" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; color: #ef4444; text-align: center;">
                    {{ errorMessage() }}
                </div>
            }

            <div class="auth-card login-card" [class.active]="showLogin()">
                <div class="card-header">
                    <h2>Welcome Back</h2>
                    <p>Continue your professional journey</p>
                </div>

                <form class="auth-form" (submit)="onLogin($event)">
                    <div class="input-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" name="email" [(ngModel)]="loginEmail" required>
                        <span class="input-line"></span>
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" [(ngModel)]="loginPassword" required>
                        <span class="input-line"></span>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="primary-btn" [disabled]="loading()">
                        <span>{{ loading() ? 'Signing In...' : 'Sign In' }}</span>
                        <div class="btn-gradient"></div>
                    </button>
                </form>

                <div class="auth-switch">
                    <p>New to FreelanceHub? <button type="button" class="switch-btn" (click)="switchToSignup()">Create Account</button></p>
                </div>
            </div>

            <div class="auth-card signup-card" [class.active]="!showLogin()">
                <div class="card-header">
                    <h2>Join FreelanceHub</h2>
                    <p>Start your professional journey today</p>
                </div>

                <div class="user-type-selector">
                    <button type="button" class="type-btn" [class.active]="userType() === 'freelancer'" (click)="selectUserType('freelancer')">
                        <span class="type-icon">💼</span>
                        <span>I'm a Freelancer</span>
                    </button>
                    <button type="button" class="type-btn" [class.active]="userType() === 'client'" (click)="selectUserType('client')">
                        <span class="type-icon">🏢</span>
                        <span>I'm a Client</span>
                    </button>
                </div>

                <form class="auth-form" (submit)="onSignup($event)">
                    <div class="input-row">
                        <div class="input-group half-width">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName" [(ngModel)]="signupFirstName" required>
                            <span class="input-line"></span>
                        </div>
                        <div class="input-group half-width">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="lastName" [(ngModel)]="signupLastName" required>
                            <span class="input-line"></span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="signupEmail">Email Address</label>
                        <input type="email" id="signupEmail" name="email" [(ngModel)]="signupEmail" required>
                        <span class="input-line"></span>
                    </div>

                    <div class="input-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" name="password" [(ngModel)]="signupPassword" required>
                        <span class="input-line"></span>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="signupConfirmPassword" required>
                        <span class="input-line"></span>
                    </div>

                    <label class="checkbox-container terms-checkbox">
                        <input type="checkbox" id="agreeTerms" required>
                        <span class="checkmark"></span>
                        I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
                    </label>

                    <button type="submit" class="primary-btn" [disabled]="loading()">
                        <span>{{ loading() ? 'Creating Account...' : 'Create Account' }}</span>
                        <div class="btn-gradient"></div>
                    </button>
                </form>

                <div class="auth-switch">
                    <p>Already have an account? <button type="button" class="switch-btn" (click)="switchToLogin()">Sign In</button></p>
                </div>
            </div>
        </main>
    </div>
</div>
